<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong Lensing Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Strong Lensing Detector</h1>
            <div class="status-bar">
                <div class="status-item">
                    <span class="label">Round:</span>
                    <span id="current-round" class="count">0</span>
                </div>
                <div class="status-item">
                    <span class="label">Selected SL:</span>
                    <span id="sl-count" class="count">0</span>
                </div>
                <div class="status-item">
                    <span class="label">Selected Non-SL:</span>
                    <span id="non-sl-count" class="count">0</span>
                </div>
                <div class="status-item">
                    <span class="label">Testing SL:</span>
                    <span id="testing-sl-count" class="count">0</span>
                </div>
                <div class="status-item">
                    <span class="label">Testing Non-SL:</span>
                    <span id="testing-non-sl-count" class="count">0</span>
                </div>
                <div class="status-item">
                    <span class="label">Recovered:</span>
                    <span id="recovered-count" class="count">0</span>
                </div>
                <div class="status-item">
                    <span class="label">Available:</span>
                    <span id="available-count" class="count">0</span>
                </div>
                <div class="status-item">
                    <span class="label">Total Submissions:</span>
                    <span id="total-submissions" class="count">0</span>
                </div>
            </div>
        </header>
        
        <!-- Training Overlay -->
        <div id="training-overlay" class="training-overlay" style="display: none;">
            <div class="training-overlay-content">
                <h2>Training Model...</h2>
                <div class="spinner"></div>
                <p id="training-message">Please wait while the model is being trained.</p>
            </div>
        </div>

        <div class="image-grid-container">
            <div id="image-grid" class="image-grid">
                <!-- Images will be loaded here -->
            </div>
        </div>

        <div class="selection-controls">
            <div class="submit-controls">
                <button id="submit-selections-btn" class="btn btn-primary">Submit</button>
                <button id="clear-selections-btn" class="btn btn-secondary">Reset Round</button>
                <button id="reset-model-btn" class="btn btn-secondary">Reset Model</button>
                <button id="sl-gallery-btn" class="btn btn-info" onclick="window.location.href='/gallery'">Gallery</button>
            </div>
        </div>

        <!-- Visualization Section (only shown after training) -->
        <div id="visualization-section" class="visualization-section" style="display: none;">
            <h3>Model Results</h3>
            <div class="visualization-container">
                <img id="visualization-image" src="" alt="Training Results" style="max-width: 100%; height: auto;">
            </div>
            <div class="visualization-container" style="margin-top: 16px;">
                <img id="history-image" src="" alt="Training History" style="max-width: 100%; height: auto;">
            </div>
            <div id="history-plots-row" class="history-plots-row" style="display: none;">
                <div id="selection-history-panel" class="visualization-container history-plot-cell" style="display: none;">
                    <img id="selection-history-image" src="" alt="Selection History" style="max-width: 100%; height: auto;">
                </div>
                <div id="median-rank-history-panel" class="visualization-container history-plot-cell" style="display: none;">
                    <img id="median-rank-history-image" src="" alt="Median Rank History" style="max-width: 100%; height: auto;">
                </div>
            </div>
        </div>

        <!-- Notification -->
        <div id="notification" class="notification"></div>

        <!-- Image Popup Modal -->
        <div id="image-popup-modal" class="image-popup-modal">
            <div class="image-popup-container">
                <div class="image-popup-info" id="popup-info"></div>
                <button class="image-popup-close" id="popup-close">&times;</button>
                <img id="popup-image" src="" alt="Enlarged Image">
                <div class="image-popup-zoom-info" id="popup-zoom-info">Scroll to zoom</div>
            </div>
        </div>

    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
